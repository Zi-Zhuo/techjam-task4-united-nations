[workspace]
name = "techjam-conversational-search"
version = "0.1.0"
description = "Reproducible final submission for the TechJam Conversational E-Commerce Search Challenge"
channels = ["conda-forge"]
platforms = [
    { platform = "linux-64", cuda = "12" },
    "osx-64",
    "osx-arm64",
    "win-64",
]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=2.0,<3"
sentence-transformers = ">=5.0,<6"

# conda-forge publishes the CUDA-enabled PyTorch variant only for NVIDIA
# platforms. Keep the portable CPU dependency resolution for macOS, while
# selecting the GPU metapackage on Linux; it pulls the matching CUDA runtime.
[target.linux-64.dependencies]
pytorch-gpu = ">=2.13,<2.14"

[tasks]
download-data = "python scripts/data.py download"
data-info = "python scripts/data.py describe"
validate-public-data = "python scripts/data.py validate-public"
validate-data = "python scripts/data.py validate"
test = "python -m unittest discover -s tests -v"
check = { depends-on = ["test", "validate-data"] }
evaluate = { cmd = "python -m evaluator.local_evaluator", depends-on = ["validate-data"] }
evaluate-robustness = { cmd = "python -m scripts.evaluate_robustness --output robustness_results.json", depends-on = ["validate-data"] }
runtime-check = "python -m scripts.runtime_check"
evaluate-offline-cpu = { cmd = "python -m evaluator.local_evaluator", depends-on = ["validate-data"], env = { BERT_DEVICE = "cpu", HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" } }
